[package]
name = "claude-usage-monitor"
version = "0.1.0"
edition = "2021"
description = "Live TUI dashboard for claude.ai usage (5h / 7d / extra credits)"
license = "MIT"
repository = "https://github.com/maxhuntdesign/claude-usage-monitor"
readme = "README.md"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
rquest = { version = "5.1", features = ["json"] }
rquest-util = { version = "2.2", features = ["emulation"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
chrono = "0.4"
